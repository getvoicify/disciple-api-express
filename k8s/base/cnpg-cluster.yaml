apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: disciple-api-db
  namespace: disciple-api
  labels:
    app.kubernetes.io/name: disciple-api
    app.kubernetes.io/component: database
spec:
  instances: 1

  # PostgreSQL configuration
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "4MB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

  # Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  # Storage configuration
  storage:
    size: 8Gi
    storageClass: "default"

  # Monitoring
  monitoring:
    enabled: true
    podMonitorName: "disciple-api-db"

  # Database initialization
  bootstrap:
    initdb:
      database: "disciple_api"
      owner: "disciple_user"
      secret:
        name: "disciple-api-db-credentials"

  # Backup configuration (optional)
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: "s3://your-backup-bucket/disciple-api"
      s3Credentials:
        accessKeyId:
          name: "backup-credentials"
          key: "AWS_ACCESS_KEY_ID"
        secretAccessKey:
          name: "backup-credentials"
          key: "AWS_SECRET_ACCESS_KEY"
      wal:
        retention: "7d"
      data:
        retention: "7d"