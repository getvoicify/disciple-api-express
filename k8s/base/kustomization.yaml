apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: disciple-api

resources:
- namespace.yaml
- configmap.yaml
- sealedsecret.yaml
- image-pull-sealed.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- cnpg-secret.yaml
- cnpg-cluster.yaml
- db-migration-job.yaml

commonLabels:
  app.kubernetes.io/name: disciple-api
  app.kubernetes.io/part-of: disciple-platform

images:
- name: ghcr.io/getvoicify/disciple-api-express
  newTag: latest