apiVersion: batch/v1
kind: Job
metadata:
  name: disciple-api-db-migration
  namespace: disciple-api
  labels:
    app.kubernetes.io/name: disciple-api
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disciple-api
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: image-pull-secret
      containers:
      - name: db-migration
        image: ghcr.io/getvoicify/disciple-api-express:latest
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "Starting database migration for preview environment..."
            echo "Database host: $DB_HOST"
            echo "Database name: $POSTGRES_DB"
            echo "Database user: $POSTGRES_USER"

            # Wait for database to be ready
            echo "Waiting for database to be ready..."
            timeout 300 sh -c 'until pg_isready -h $DB_HOST -p $DB_PORT -U $POSTGRES_USER; do echo "Waiting for database..."; sleep 2; done'

            if [ $? -eq 0 ]; then
              echo "Database is ready!"
              echo "Running any database setup scripts here..."
              # Add your migration commands here
              # Example: npm run migrate or custom SQL scripts
              echo "Database migration completed successfully"
            else
              echo "Database connection timeout"
              exit 1
            fi
        envFrom:
        - configMapRef:
            name: disciple-api-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: disciple-api-db-credentials
              key: password
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"