apiVersion: apps/v1
kind: Deployment
metadata:
  name: disciple-api
  namespace: disciple-api
  labels:
    app.kubernetes.io/name: disciple-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: disciple-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disciple-api
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
      - name: image-pull-secret
      containers:
      - name: api
        image: ghcr.io/getvoicify/disciple-api-express:latest
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: disciple-api-config
        - secretRef:
            name: disciple-api-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: worker
        image: ghcr.io/getvoicify/disciple-api-express:latest
        command: ["node", "dist/worker.js"]
        envFrom:
        - configMapRef:
            name: disciple-api-config
        - secretRef:
            name: disciple-api-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep 'node dist/worker.js' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      securityContext:
        fsGroup: 1001