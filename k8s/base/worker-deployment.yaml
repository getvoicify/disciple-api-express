apiVersion: apps/v1
kind: Deployment
metadata:
  name: disciple-api-worker
  namespace: disciple-api
  labels:
    app.kubernetes.io/name: disciple-api
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: disciple-api
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disciple-api
        app.kubernetes.io/component: worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - disciple-api
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - worker
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
      - name: image-pull-secret
      containers:
      - name: worker
        image: ghcr.io/getvoicify/disciple-api-express:latest
        command: ["node", "dist/worker.js"]
        envFrom:
        - configMapRef:
            name: disciple-api-config
        - secretRef:
            name: disciple-api-secrets
        - secretRef:
            name: disciple-api-redis-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      securityContext:
        fsGroup: 1001
