apiVersion: apps/v1
kind: Deployment
metadata:
  name: disciple-api-worker
  namespace: disciple-api
  labels:
    app.kubernetes.io/name: disciple-api-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: disciple-api
spec:
  replicas: 1  # Usually one worker is sufficient
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Ensure worker availability during updates
  selector:
    matchLabels:
      app.kubernetes.io/name: disciple-api-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disciple-api-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: disciple-api
    spec:
      imagePullSecrets:
      - name: image-pull-secret
      containers:
      - name: worker
        image: ghcr.io/getvoicify/disciple-api-express:latest
        command: ["node", "dist/worker.js"]
        envFrom:
        - configMapRef:
            name: disciple-api-config
        - secretRef:
            name: disciple-api-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep 'node dist/worker.js' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      securityContext:
        fsGroup: 1001
      restartPolicy: Always
      terminationGracePeriodSeconds: 30  # Give worker time to finish current tasks