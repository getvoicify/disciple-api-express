apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: disciple-api-staging

resources:
- ../../base

commonLabels:
  app.kubernetes.io/environment: staging
  app.kubernetes.io/instance: staging

patches:
- target:
    kind: Deployment
    name: disciple-api
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 128Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 512Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 1000m
- target:
    kind: Deployment
    name: disciple-api-worker
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 0
- target:
    kind: ConfigMap
    name: disciple-api-config
  patch: |-
    - op: add
      path: /data/NODE_ENV
      value: staging
    - op: add
      path: /data/LOG_LEVEL
      value: info
    - op: add
      path: /data/DB_PORT
      value: "6543"
- target:
    kind: Ingress
    name: disciple-api
  patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: staging.infra.api.pottersville.church
    - op: replace
      path: /spec/rules/0/host
      value: staging.infra.api.pottersville.church
    - op: replace
      path: /spec/tls/0/secretName
      value: disciple-api-staging-tls



