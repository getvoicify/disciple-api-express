apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: disciple-api-preview

resources:
- ../../base

commonLabels:
  app.kubernetes.io/environment: preview
  app.kubernetes.io/instance: preview

patches:
- target:
    kind: Deployment
    name: disciple-api
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 64Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 50m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 256Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 500m
- target:
    kind: ConfigMap
    name: disciple-api-config
  patch: |-
    - op: add
      path: /data/NODE_ENV
      value: preview
    - op: add
      path: /data/LOG_LEVEL
      value: debug



