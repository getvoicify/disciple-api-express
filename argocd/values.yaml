# Values for ArgoCD ApplicationSet
# This file is used to configure staging and production deployments

# Staging environment - deployed on prerelease
stagingTag: "latest"  # This will be updated by GitHub Actions

# Production environment - deployed on stable release
productionTag: "latest"  # This will be updated by GitHub Actions

# Global configuration
global:
  domain: "infra.api.pottersville.church"
  previewDomain: "preview.infra.api.pottersville.church"

environments:
  staging:
    replicas: 2
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "1000m"

  production:
    replicas: 3
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "2000m"

  preview:
    replicas: 1
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "500m"