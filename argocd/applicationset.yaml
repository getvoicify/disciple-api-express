apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: disciple-api-preview
  namespace: argocd
spec:
  generators:
  # Generator for preview environments (PR-based)
  - pullRequest:
      github:
        owner: getvoicify
        repo: disciple-api-express
        tokenRef:
          secretName: disciple-api-preview
          key: password
        labels:
        - preview
      requeueAfterSeconds: 300
  template:
    metadata:
      name: 'disciple-api-preview-pr-{{number}}'
      labels:
        app.kubernetes.io/name: disciple-api
        app.kubernetes.io/environment: preview
        app.kubernetes.io/pr-number: '{{number}}'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
        link.argocd.argoproj.io/external-link: https://github.com/getvoicify/disciple-api-express/pull/{{number}}
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/getvoicify/disciple-api-express.git
        targetRevision: '{{head_sha}}'
        path: 'k8s/overlays/preview'
        kustomize:
          images:
          - 'ghcr.io/getvoicify/disciple-api-express:pr-{{number}}-{{head_sha}}'
          patches:
          # Preview environment patches
          - target:
              kind: Deployment
              name: disciple-api
            patch: |
              - op: replace
                path: /metadata/namespace
                value: disciple-api-preview-{{number}}
              - op: replace
                path: /spec/replicas
                value: 1
              - op: add
                path: /spec/template/spec/containers/0/env
                value:
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: disciple-api-preview-{{number}}-db-credentials
                        key: password
          - target:
              kind: Service
              name: disciple-api
            patch: |
              - op: replace
                path: /metadata/namespace
                value: disciple-api-preview-{{number}}
          - target:
              kind: ConfigMap
              name: disciple-api-config
            patch: |
              - op: replace
                path: /metadata/namespace
                value: disciple-api-preview-{{number}}
              - op: add
                path: /data/PR_NUMBER
                value: "{{number}}"
              - op: add
                path: /data/PR_BRANCH
                value: "{{branch}}"
              - op: replace
                path: /data/DB_HOST
                value: disciple-api-preview-{{number}}-db-rw
              - op: replace
                path: /data/DB_PORT
                value: "5432"
              - op: add
                path: /data/POSTGRES_DB
                value: disciple_api_preview_{{number}}
              - op: add
                path: /data/POSTGRES_USER
                value: disciple_user
          - target:
              kind: SealedSecret
              name: disciple-api-secrets
            patch: |
              - op: replace
                path: /metadata/namespace
                value: disciple-api-preview-{{number}}
              - op: replace
                path: /spec/encryptedData/POSTGRES_PASSWORD
                value: AgPreviewDbPassword{{number}}Encrypted
              - op: replace
                path: /spec/template/metadata/name
                value: disciple-api-preview-{{number}}-secrets
          - target:
              kind: Ingress
              name: disciple-api
            patch: |
              - op: replace
                path: /metadata/namespace
                value: disciple-api-preview-{{number}}
              - op: replace
                path: /spec/tls/0/hosts/0
                value: pr-{{number}}.preview.infra.api.pottersville.church
              - op: replace
                path: /spec/rules/0/host
                value: pr-{{number}}.preview.infra.api.pottersville.church
              - op: replace
                path: /spec/tls/0/secretName
                value: disciple-api-preview-{{number}}-tls
          - target:
              kind: Cluster
              name: disciple-api-db
            patch: |
              - op: replace
                path: /metadata/name
                value: disciple-api-preview-{{number}}-db
              - op: replace
                path: /metadata/namespace
                value: disciple-api-preview-{{number}}
              - op: replace
                path: /spec/bootstrap/initdb/database
                value: disciple_api_preview_{{number}}
              - op: replace
                path: /spec/bootstrap/initdb/secret/name
                value: disciple-api-preview-{{number}}-db-credentials
              - op: replace
                path: /spec/monitoring/podMonitorName
                value: disciple-api-preview-{{number}}-db
          - target:
              kind: Secret
              name: disciple-api-db-credentials
            patch: |
              - op: replace
                path: /metadata/name
                value: disciple-api-preview-{{number}}-db-credentials
              - op: replace
                path: /metadata/namespace
                value: disciple-api-preview-{{number}}
              - op: replace
                path: /stringData/password
                value: preview-db-{{number}}-password
          - target:
              kind: Secret
              name: backup-credentials
            patch: |
              - op: replace
                path: /metadata/name
                value: disciple-api-preview-{{number}}-backup-credentials
              - op: replace
                path: /metadata/namespace
                value: disciple-api-preview-{{number}}
          - target:
              kind: Job
              name: disciple-api-db-migration
            patch: |
              - op: replace
                path: /metadata/name
                value: disciple-api-preview-{{number}}-db-migration
              - op: replace
                path: /metadata/namespace
                value: disciple-api-preview-{{number}}
              - op: replace
                path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
                value: disciple-api-preview-{{number}}-db-credentials
      destination:
        server: https://kubernetes.default.svc
        namespace: 'disciple-api-preview-{{number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - PrunePropagationPolicy=foreground
        - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      info:
      - name: 'Pull Request'
        value: 'https://github.com/getvoicify/disciple-api-express/pull/{{number}}'
      - name: 'Preview URL'
        value: 'https://pr-{{number}}.preview.infra.api.pottersville.church'
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: disciple-api-environments
  namespace: argocd
spec:
  generators:
  # Generator for static environments (staging & production)
  - list:
      elements:
      - environment: staging
        namespace: disciple-api-staging
        imageTag: "1.8.0"
        replicas: "2"
      - environment: production
        namespace: disciple-api-production
        imageTag: "1.7.1"
        replicas: "3"
  template:
    metadata:
      name: 'disciple-api-{{environment}}'
      labels:
        app.kubernetes.io/name: disciple-api
        app.kubernetes.io/environment: '{{environment}}'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: https://github.com/getvoicify/disciple-api-express.git
        targetRevision: HEAD
        path: 'k8s/overlays/{{environment}}'
        kustomize:
          images:
          - 'ghcr.io/getvoicify/disciple-api-express:{{imageTag}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - PrunePropagationPolicy=foreground
        - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
