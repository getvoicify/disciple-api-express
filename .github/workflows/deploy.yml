name: Deploy to Production

on:
  release:
    types: [edited]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Deploy to production when prerelease flag is removed
  deploy-production:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false && github.event.action == 'edited'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Update production tag in ApplicationSet
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present to match Docker tag format
          VERSION=${VERSION#v}
          echo "Updating production deployment to version $VERSION"
          sed -i '/environment: production/,/replicas:/s/imageTag: ".*"/imageTag: "'$VERSION'"/' argocd/applicationset.yaml

      - name: Commit production deployment update
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION=${VERSION#v}
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add argocd/applicationset.yaml
          git commit -m "deploy: update production to $VERSION [skip ci]" || exit 0
          git push origin main

      - name: Log production deployment
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION=${VERSION#v}
          echo "🎉 Production Deployment Triggered"
          echo "Version: $VERSION (from release ${{ github.event.release.tag_name }})"
          echo "Environment: Production"
          echo "Image: ghcr.io/${{ github.repository }}:$VERSION"
          echo "Namespace: disciple-api-production"
          echo ""
          echo "ArgoCD will automatically deploy this version to the production environment."
          echo "Production URL: https://disciple-api.example.com"
          echo "ArgoCD Application: disciple-api-production"
          echo ""
          echo "🚀 Release is now live in production!"