name: Deploy to Production

on:
  release:
    types: [edited]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Deploy to production when prerelease flag is removed
  deploy-production:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false && github.event.action == 'edited'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Update production tag in ApplicationSet
        run: |
          echo "Updating production deployment to version ${{ github.event.release.tag_name }}"
          sed -i '/environment: production/,/replicas:/s/imageTag: ".*"/imageTag: "${{ github.event.release.tag_name }}"/' argocd/applicationset.yaml

      - name: Commit production deployment update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add argocd/applicationset.yaml
          git commit -m "deploy: update production to ${{ github.event.release.tag_name }} [skip ci]" || exit 0
          git push origin main

      - name: Comment on release
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🎉 **Production Deployment Triggered**

            **Version**: \`${{ github.event.release.tag_name }}\`
            **Environment**: Production
            **Image**: \`ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}\`
            **Namespace**: \`disciple-api-production\`

            ArgoCD will automatically deploy this version to the production environment.

            **Production URL**: https://disciple-api.example.com
            **ArgoCD Application**: \`disciple-api-production\`

            🚀 Release is now live in production!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.release.id }},
              body: body
            });