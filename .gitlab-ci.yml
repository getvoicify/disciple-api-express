stages:
  - test
  - release
  - build
  - security
  - deploy

variables:
  NODE_IMAGE: node:20-alpine

.node-cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - node_modules/

# ============================================
# Test (MRs + main pushes)
# ============================================
test:
  stage: test
  image: $NODE_IMAGE
  extends: .node-cache
  script:
    - npm ci
    - npm run lint --if-present
    - npm test --if-present
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|master)$/ && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/

# ============================================
# Semantic Release (main push only)
# Creates a git tag + GitLab release, which
# triggers the tag pipeline for build/deploy.
# ============================================
release:
  stage: release
  image: $NODE_IMAGE
  extends: .node-cache
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
    - git config --global user.email "gitlab-ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - npm ci
    - npm install --no-save @semantic-release/gitlab
    - npx semantic-release -e ./.releaserc.gitlab.json
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|master)$/ && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/

# ============================================
# Docker Build & Push (tag pipeline)
# Triggered automatically when semantic-release
# creates a version tag (e.g. v2.13.0).
# ============================================
docker:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use --name multiarch --driver docker-container
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg VERSION=$VERSION \
        --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        --build-arg COMMIT_SHA=$CI_COMMIT_SHA \
        --tag $CI_REGISTRY_IMAGE:$VERSION \
        --tag $CI_REGISTRY_IMAGE:${VERSION%%.*} \
        --tag $CI_REGISTRY_IMAGE:${VERSION%.*} \
        --tag $CI_REGISTRY_IMAGE:latest \
        --push .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/

# ============================================
# Security Scan (tag pipeline)
# ============================================
security-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      trivy image \
        --severity CRITICAL,HIGH \
        --exit-code 0 \
        --format table \
        $CI_REGISTRY_IMAGE:$VERSION
  needs:
    - job: docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
  allow_failure: true

# ============================================
# Deploy Staging (auto, tag pipeline)
# Updates argocd/applicationset.yaml and pushes.
# ============================================
deploy-staging:
  stage: deploy
  image: $NODE_IMAGE
  before_script:
    - apk add --no-cache git sed
    - git config --global user.email "gitlab-ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      git clone --depth=1 "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" repo
      cd repo
      sed -i "/environment: staging/,/environment: production/s/imageTag: \".*\"/imageTag: \"$VERSION\"/" argocd/applicationset.yaml
      git add argocd/applicationset.yaml
      git diff --cached --quiet && echo "No changes to commit" && exit 0
      git commit -m "deploy: update staging to $VERSION [skip ci]"
      git push origin main
  needs:
    - job: docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
  environment:
    name: staging
    url: https://staging.infra.api.pottersville.church

# ============================================
# Deploy Production (manual, tag pipeline)
# Requires manual approval in GitLab UI.
# ============================================
deploy-production:
  stage: deploy
  image: $NODE_IMAGE
  before_script:
    - apk add --no-cache git sed
    - git config --global user.email "gitlab-ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      git clone --depth=1 "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" repo
      cd repo
      sed -i "/environment: production/,/replicas:/s/imageTag: \".*\"/imageTag: \"$VERSION\"/" argocd/applicationset.yaml
      git add argocd/applicationset.yaml
      git diff --cached --quiet && echo "No changes to commit" && exit 0
      git commit -m "deploy: update production to $VERSION [skip ci]"
      git push origin main
  needs:
    - job: deploy-staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
      when: manual
  environment:
    name: production
    url: https://disciple-api.example.com

# ============================================
# Preview Build (MRs with "preview" label)
# ============================================
build-preview:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --build-arg VERSION=mr-$CI_MERGE_REQUEST_IID \
        --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        --build-arg COMMIT_SHA=$CI_COMMIT_SHA \
        --tag $CI_REGISTRY_IMAGE:mr-$CI_MERGE_REQUEST_IID-$CI_COMMIT_SHORT_SHA \
        --push .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /preview/
  environment:
    name: preview/$CI_MERGE_REQUEST_IID
    url: https://mr-$CI_MERGE_REQUEST_IID.preview.infra.api.pottersville.church
    on_stop: cleanup-preview

# ============================================
# Cleanup Preview (on MR close/merge)
# ============================================
cleanup-preview:
  stage: deploy
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Preview environment mr-$CI_MERGE_REQUEST_IID cleaned up by ArgoCD ApplicationSet"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /preview/
      when: manual
  environment:
    name: preview/$CI_MERGE_REQUEST_IID
    action: stop
